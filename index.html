<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wind Waker HD Checklist</title>
<meta name="theme-color" content="#071a24">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WW Checklist">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="Icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="Icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <div class="brand">
    <svg class="tri" viewBox="0 0 40 36" aria-hidden="true"><path d="M20 2 L27 14 H13Z M13 14 L20 26 H6Z M27 14 L34 26 H20Z" fill="#f2c14e" stroke="#04101a" stroke-width="2.2" stroke-linejoin="round"/></svg>
    <div class="titles">
      <h1>The Wind Waker <span>HD</span></h1>
      <p id="subtitle">Great Sea Checklist</p>
    </div>
    <div id="overall-pct" class="pct">0%</div>
  </div>
  <div class="bar"><i id="overall-bar"></i></div>
  <div id="toolbar" class="toolbar">
    <button id="btn-jump" type="button">Jump to</button>
    <button id="btn-next" type="button">Next item</button>
    <button id="btn-hide" type="button" aria-pressed="false">Hide done</button>
  </div>
</header>

<main>
  <div id="list-view"><div id="list"></div></div>
  <div id="hub-view" hidden></div>
</main>

<nav id="tabs" aria-label="Pages">
  <button id="tab-list" type="button" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h2M5 12h2M5 18h2M10 6h9M10 12h9M10 18h9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Checklist</button>
  <button id="tab-hub" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Hub</button>
</nav>

<div id="sheet" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet-card" role="dialog" aria-label="Jump to chapter">
    <h2>Jump to a chapter</h2>
    <div id="sheet-list"></div>
    <button id="sheet-close" type="button" class="wide">Close</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
